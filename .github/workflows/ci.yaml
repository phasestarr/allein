name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt

      - name: 'lint: source and configuration conventions'
        run: python validation/validate.py lint

      - name: 'build: compile validation tooling'
        run: python validation/validate.py build

      - name: 'test: CI policy and validator regression cases'
        run: python validation/validate.py test
